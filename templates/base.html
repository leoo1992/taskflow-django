{% load static %}<!doctype html><html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101e"><title>TaskFlow</title><link rel="stylesheet" href="{% static 'css/app.css' %}"></head><body><header><a class="brand" href="/"><span class="brand-mark">T</span><span>TaskFlow</span></a>{% if user.is_authenticated %}<nav class="desktop-nav"><a href="/">Dashboard</a><a href="/projetos/">Projetos</a><a href="/tarefas/">Tarefas</a><form action="/accounts/logout/" method="post">{% csrf_token %}<button class="link">Sair</button></form></nav>{% endif %}</header><main>{% block content %}{% endblock %}</main>{% if user.is_authenticated %}<nav class="mobile-tabs" aria-label="Navegação principal"><a href="/" class="{% if request.path == '/' %}active{% endif %}"><span class="tab-icon" aria-hidden="true">⌂</span><span>Início</span></a><a href="/projetos/" class="{% if '/projetos/' in request.path %}active{% endif %}"><span class="tab-icon" aria-hidden="true">▣</span><span>Projetos</span></a><a href="/tarefas/" class="{% if '/tarefas/' in request.path %}active{% endif %}"><span class="tab-icon" aria-hidden="true">✓</span><span>Tarefas</span></a><form action="/accounts/logout/" method="post">{% csrf_token %}<button type="submit"><span class="tab-icon" aria-hidden="true">↪</span><span>Sair</span></button></form></nav>{% endif %}</body></html>
