{% extends "base.html" %}{% block content %}<div class="heading"><h1>Tarefas</h1><a class="button" href="/tarefas/nova/">+ Nova tarefa</a></div><form class="filters card"><input name="q" value="{{q}}" placeholder="Buscar"><select name="status"><option value="">Todos</option>{% for v,l in statuses %}<option value="{{v}}" {% if status == v %}selected{% endif %}>{{l}}</option>{% endfor %}</select><button>Filtrar</button></form><section class="card">{% for t in tasks %}<div class="row"><div><strong>{{t.title}}</strong><small>{{t.project.name}} · {{t.get_priority_display}}</small></div><div class="actions"><span class="badge">{{t.get_status_display}}</span><a href="/tarefas/{{t.id}}/editar/">Editar</a><a class="danger" href="/tarefas/{{t.id}}/excluir/">Excluir</a></div></div>{% empty %}<p>Nenhuma tarefa.</p>{% endfor %}</section>{% endblock %}
