{% extends "base.html" %}{% block content %}<div class="heading"><h1>Projetos</h1><a class="button" href="/projetos/novo/">+ Novo projeto</a></div><section class="grid">{% for p in projects %}<article class="card"><h2>{{p.name}}</h2><p>{{p.description|default:"Sem descrição."}}</p><div class="actions"><a href="/projetos/{{p.id}}/editar/">Editar</a><a class="danger" href="/projetos/{{p.id}}/excluir/">Excluir</a></div></article>{% empty %}<p>Nenhum projeto.</p>{% endfor %}</section>{% endblock %}
